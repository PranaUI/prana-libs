
name: Build Skia

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================
  # BUILD LINUX X64
  # ==========================================
  build-linux:
    name: Build Skia Chrome 158 (Linux x64)
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Skia Chrome 158
      - name: Checkout Skia Repository
        uses: actions/checkout@v4
        with:
          repository: google/skia
          ref: chrome/150
          fetch-depth: 1
          path: skia

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Install prerequisites
      - name: Install Prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            libfontconfig-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            git \
            python3-venv \
            ninja-build \
            zip \
            unzip

      # 4. Verify Skia version
      - name: Verify Skia Version
        working-directory: skia
        run: |
          echo "Skia branch:"
          git branch --show-current

          echo "Skia commit:"
          git rev-parse HEAD

          echo "Skia milestone:"
          grep SK_MILESTONE include/core/SkMilestone.h

      # 5. Sync dependencies
      - name: Sync Skia Dependencies
        working-directory: skia
        run: |
          set -e

          git config --global http.version HTTP/1.1

          for attempt in 1 2 3 4; do
            echo "Dependency sync attempt $attempt"

            if python tools/git-sync-deps; then
              echo "Dependencies synced successfully"
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Dependency synchronization failed"
              exit 1
            fi

            sleep 10
          done

      # 6. Fetch GN
      - name: Fetch GN
        working-directory: skia
        run: |
          bin/fetch-gn
          chmod +x bin/gn
          bin/gn --version

      # 7. Generate build files
      - name: Generate Build Files
        working-directory: skia
        run: |
          bin/gn gen out/Linux_x64 --args='
            target_os="linux"
            target_cpu="x64"

            is_debug=false
            is_official_build=true

            skia_enable_ganesh=true

            skia_use_gl=true
            skia_use_vulkan=true

            skia_use_freetype=true
            skia_use_harfbuzz=true
            skia_use_icu=true

            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
          '

      # 8. Compile Skia
      - name: Compile Skia
        working-directory: skia
        run: |
          ninja -C out/Linux_x64

      # 9. Package Linux libraries and headers
      - name: Package Linux Artifacts
        working-directory: skia
        run: |
          set -e

          mkdir -p release_assets/lib

          echo "======================================"
          echo "Copying main Skia headers"
          echo "======================================"

          cp -r include release_assets/

          echo "======================================"
          echo "Copying modules headers recursively"
          echo "======================================"

          if [ -d modules ]; then
            find modules -type f \
              \( -name "*.h" \
              -o -name "*.hpp" \
              -o -name "*.hh" \
              -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          echo "======================================"
          echo "Copying third_party headers recursively"
          echo "======================================"

          if [ -d third_party ]; then
            find third_party -type f \
              \( -name "*.h" \
              -o -name "*.hpp" \
              -o -name "*.hh" \
              -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          echo "======================================"
          echo "Copying compiled libraries"
          echo "======================================"

          find out/Linux_x64 -type f \
            \( -name "*.a" -o -name "*.so" \) \
            -exec cp {} release_assets/lib/ \;

          # Validate libraries
          if [ -z "$(find release_assets/lib -type f -print -quit)" ]; then
            echo "No compiled libraries found!"
            exit 1
          fi

          echo "======================================"
          echo "Package summary"
          echo "======================================"

          echo "Main headers:"
          find release_assets/include -type f | wc -l

          echo "Modules headers:"
          find release_assets/modules -type f 2>/dev/null | wc -l

          echo "Third-party headers:"
          find release_assets/third_party -type f 2>/dev/null | wc -l

          echo "Libraries:"
          ls -lh release_assets/lib

          # Create TAR.GZ
          tar -czvf skia-chrome158-linux-x64-prebuilt.tar.gz \
            -C release_assets .

          # Verify archive
          echo "Verifying Linux archive..."
          tar -tzf skia-chrome158-linux-x64-prebuilt.tar.gz

      # 10. Upload Linux artifact
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-chrome158-linux-x64
          path: skia/skia-chrome158-linux-x64-prebuilt.tar.gz
          if-no-files-found: error
          retention-days: 7


  # ==========================================
  # BUILD ANDROID ARM64
  # ==========================================
  build-android:
    name: Build Skia Chrome 158 (Android ARM64)
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Skia Chrome 158
      - name: Checkout Skia Repository
        uses: actions/checkout@v4
        with:
          repository: google/skia
          ref: chrome/150
          fetch-depth: 1
          path: skia

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Install prerequisites
      - name: Install Prerequisites
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            libfontconfig-dev \
            git \
            python3-venv \
            ninja-build \
            zip \
            unzip

      # 4. Validate Android NDK
      - name: Check Android NDK
        run: |
          echo "Android NDK: $ANDROID_NDK_LATEST_HOME"

          if [ -z "$ANDROID_NDK_LATEST_HOME" ] || \
             [ ! -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "Android NDK not found!"
            exit 1
          fi

      # 5. Verify Skia version
      - name: Verify Skia Version
        working-directory: skia
        run: |
          echo "Skia branch:"
          git branch --show-current

          echo "Skia commit:"
          git rev-parse HEAD

          echo "Skia milestone:"
          grep SK_MILESTONE include/core/SkMilestone.h

      # 6. Sync dependencies
      - name: Sync Skia Dependencies
        working-directory: skia
        run: |
          set -e

          git config --global http.version HTTP/1.1

          for attempt in 1 2 3 4; do
            echo "Dependency sync attempt $attempt"

            if python tools/git-sync-deps; then
              echo "Dependencies synced successfully"
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "Dependency synchronization failed"
              exit 1
            fi

            sleep 10
          done

      # 7. Fetch GN
      - name: Fetch GN
        working-directory: skia
        run: |
          bin/fetch-gn
          chmod +x bin/gn
          bin/gn --version

      # 8. Generate build files
      - name: Generate Build Files
        working-directory: skia
        run: |
          bin/gn gen out/Android_arm64 --args='
            ndk="'$ANDROID_NDK_LATEST_HOME'"

            target_os="android"
            target_cpu="arm64"

            is_debug=false
            is_official_build=true

            skia_enable_ganesh=true

            skia_use_gl=true
            skia_use_vulkan=true

            skia_use_freetype=true
            skia_use_harfbuzz=true
            skia_use_icu=true

            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
          '

      # 9. Compile Skia
      - name: Compile Skia
        working-directory: skia
        run: |
          ninja -C out/Android_arm64

      # 10. Package Android libraries and headers
      - name: Package Android Artifacts
        working-directory: skia
        run: |
          set -e

          mkdir -p release_assets/lib

          echo "======================================"
          echo "Copying main Skia headers"
          echo "======================================"

          cp -r include release_assets/

          echo "======================================"
          echo "Copying modules headers recursively"
          echo "======================================"

          if [ -d modules ]; then
            find modules -type f \
              \( -name "*.h" \
              -o -name "*.hpp" \
              -o -name "*.hh" \
              -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          echo "======================================"
          echo "Copying third_party headers recursively"
          echo "======================================"

          if [ -d third_party ]; then
            find third_party -type f \
              \( -name "*.h" \
              -o -name "*.hpp" \
              -o -name "*.hh" \
              -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          echo "======================================"
          echo "Copying compiled libraries"
          echo "======================================"

          find out/Android_arm64 -type f \
            \( -name "*.a" -o -name "*.so" \) \
            -exec cp {} release_assets/lib/ \;

          # Validate libraries
          if [ -z "$(find release_assets/lib -type f -print -quit)" ]; then
            echo "No compiled libraries found!"
            exit 1
          fi

          echo "======================================"
          echo "Package summary"
          echo "======================================"

          echo "Main headers:"
          find release_assets/include -type f | wc -l

          echo "Modules headers:"
          find release_assets/modules -type f 2>/dev/null | wc -l

          echo "Third-party headers:"
          find release_assets/third_party -type f 2>/dev/null | wc -l

          echo "Libraries:"
          ls -lh release_assets/lib

          # Create ZIP
          cd release_assets

          zip -r ../skia-chrome158-android-arm64-prebuilt.zip .

          cd ..

          # Verify archive
          echo "Verifying Android archive..."
          unzip -t skia-chrome158-android-arm64-prebuilt.zip

      # 11. Upload Android artifact
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-chrome158-android-arm64
          path: skia/skia-chrome158-android-arm64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7


  # ==========================================
  # PUBLISH GITHUB RELEASE
  # ==========================================
  publish-release:
    name: Publish Skia Chrome 158 Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-android

    if: github.event_name != 'pull_request'

    steps:

      # 1. Download Linux artifact
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: skia-chrome158-linux-x64
          path: release_assets

      # 2. Download Android artifact
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: skia-chrome158-android-arm64
          path: release_assets

      # 3. Publish release
      - name: Update Continuous Release
        uses: ncipollo/release-action@v1
        with:
          tag: chrome-158
          name: Skia Chrome 158 Prebuilt Libraries
          body: |
            Automated continuous build of Skia Chrome 158.

            Source:
            https://github.com/google/skia/tree/chrome/150

            Included targets:
            - Linux x64
            - Android ARM64

            Package contents:
            - Skia public headers
            - Recursive modules headers
            - Recursive third-party headers
            - Compiled static/shared libraries

          artifacts: |
            release_assets/skia-chrome158-linux-x64-prebuilt.tar.gz
            release_assets/skia-chrome158-android-arm64-prebuilt.zip

          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true