name: Build Skia for Android (chrome/m158)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# PENTING: Izin ini wajib ada agar GitHub Actions bisa membuat/mengubah Rilis
permissions:
  contents: write

jobs:
  build-android:
    name: Build Android (arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Skia Repository
        uses: actions/checkout@v4
        with:
          repository: 'google/skia'
          ref: 'chrome/m158'
          fetch-depth: 1
          path: 'skia'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfontconfig-dev git python3-venv ninja-build zip

      - name: Sync Skia Dependencies
        working-directory: skia
        run: |
          python tools/git-sync-deps

      - name: Fetch GN
        working-directory: skia
        run: |
          bin/fetch-gn

      - name: Generate Build Files (GN)
        working-directory: skia
        run: |
          bin/gn gen out/Android_arm64 --args='
            ndk="'$ANDROID_NDK_LATEST_HOME'"
            target_os="android"
            target_cpu="arm64"
            is_debug=false
            is_official_build=true
            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
          '

      - name: Compile Skia (Ninja)
        working-directory: skia
        run: |
          ninja -C out/Android_arm64

      - name: Package Artifacts (ZIP)
        working-directory: skia
        run: |
          # Membuat folder sementara untuk mengumpulkan file
          mkdir -p release_assets
          # Menyalin file .a dan .so ke folder release_assets
          find out/Android_arm64 -maxdepth 1 -type f \( -name "*.a" -o -name "*.so" \) -exec cp {} release_assets/ \;
          # Mengompres folder menjadi file ZIP
          zip -r skia-android-arm64-m158.zip release_assets/

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest" # Nama tag yang akan selalu ditimpa (update terus)
          name: "Latest Binary Build"
          body: "Automated build of Skia, SDL3, Yoga, QuickJS-NG. Asset ini akan otomatis diperbarui setiap ada commit baru."
          artifacts: "skia/skia-android-arm64-m158.zip"
          allowUpdates: true # Mengizinkan update rilis yang sudah ada
          replacesArtifacts: true # Menimpa file ZIP yang lama dengan yang baru
          makeLatest: true # Menandai rilis ini sebagai rilis terbaru
