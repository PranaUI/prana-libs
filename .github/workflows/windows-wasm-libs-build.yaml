name: Build All Prebuilt Libraries (Windows & Wasm)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. BOX2D (WINDOWS X64 & WASM)
  # ============================================================================
  build-box2d-windows:
    name: Build Box2D Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Box2D Repository
        uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1

      - name: Configure CMake (Windows)
        run: |
          cmake -S . -B build_win -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install_dir_win `
            -DBUILD_SHARED_LIBS=OFF `
            -DBOX2D_SAMPLES=OFF `
            -DBOX2D_UNIT_TESTS=OFF `
            -DBOX2D_VALIDATION=OFF

      - name: Build & Install Box2D
        run: |
          cmake --build build_win --config Release
          cmake --install build_win --config Release

      - name: Package Artifacts (ZIP)
        run: Compress-Archive -Path install_dir_win\include, install_dir_win\lib -DestinationPath box2d-windows-x64-prebuilt.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box2d-windows-x64
          path: box2d-windows-x64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  build-box2d-wasm:
    name: Build Box2D Wasm (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Box2D Repository
        uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Configure CMake (Wasm)
        run: |
          emcmake cmake -S . -B build_wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_wasm \
            -DBUILD_SHARED_LIBS=OFF \
            -DBOX2D_SAMPLES=OFF \
            -DBOX2D_UNIT_TESTS=OFF \
            -DBOX2D_VALIDATION=OFF

      - name: Build & Install Box2D
        run: |
          cmake --build build_wasm --config Release
          cmake --install build_wasm

      - name: Package Artifacts (ZIP)
        run: |
          cd install_dir_wasm
          zip -r ../box2d-wasm-prebuilt.zip include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box2d-wasm
          path: box2d-wasm-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 2. QUICKJS-NG (WINDOWS X64 & WASM)
  # ============================================================================
  build-quickjs-windows:
    name: Build QuickJS Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout QuickJS-NG Repository
        uses: actions/checkout@v4
        with:
          repository: 'quickjs-ng/quickjs'
          ref: 'master'
          fetch-depth: 1

      - name: Configure CMake (Windows)
        run: |
          cmake -S . -B build_win -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install_dir_win `
            -DBUILD_SHARED_LIBS=OFF

      - name: Build & Install QuickJS-NG
        run: |
          cmake --build build_win --config Release
          cmake --install build_win --config Release

      - name: Package Artifacts (ZIP)
        run: Compress-Archive -Path install_dir_win\include, install_dir_win\lib -DestinationPath quickjs-windows-x64-prebuilt.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-windows-x64
          path: quickjs-windows-x64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  build-quickjs-wasm:
    name: Build QuickJS Wasm (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuickJS-NG Repository
        uses: actions/checkout@v4
        with:
          repository: 'quickjs-ng/quickjs'
          ref: 'master'
          fetch-depth: 1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Configure CMake (Wasm)
        run: |
          emcmake cmake -S . -B build_wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_wasm \
            -DBUILD_SHARED_LIBS=OFF \
            -DQJS_BUILD_CLI=OFF

      - name: Build & Install QuickJS-NG
        run: |
          cmake --build build_wasm --config Release
          cmake --install build_wasm

      - name: Package Artifacts (ZIP)
        run: |
          cd install_dir_wasm
          zip -r ../quickjs-wasm-prebuilt.zip include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-wasm
          path: quickjs-wasm-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 3. SDL3 (WINDOWS X64 & WASM)
  # ============================================================================
  build-sdl3-windows:
    name: Build SDL3 Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout SDL Repository
        uses: actions/checkout@v4
        with:
          repository: 'libsdl-org/SDL'
          ref: 'main'
          fetch-depth: 1

      - name: Configure CMake (Windows)
        run: |
          cmake -S . -B build_win -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX=install_dir_win `
            -DSDL_SHARED=OFF `
            -DSDL_STATIC=ON

      - name: Build & Install SDL3
        run: |
          cmake --build build_win --config Release
          cmake --install build_win --config Release

      - name: Package Artifacts (ZIP)
        run: Compress-Archive -Path install_dir_win\include, install_dir_win\lib -DestinationPath sdl3-windows-x64-prebuilt.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-windows-x64
          path: sdl3-windows-x64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  build-sdl3-wasm:
    name: Build SDL3 Wasm (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDL Repository
        uses: actions/checkout@v4
        with:
          repository: 'libsdl-org/SDL'
          ref: 'main'
          fetch-depth: 1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Configure CMake (Wasm)
        run: |
          emcmake cmake -S . -B build_wasm -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_wasm \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON

      - name: Build & Install SDL3
        run: |
          cmake --build build_wasm --config Release
          cmake --install build_wasm

      - name: Package Artifacts (ZIP)
        run: |
          cd install_dir_wasm
          zip -r ../sdl3-wasm-prebuilt.zip include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-wasm
          path: sdl3-wasm-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 4. SKIA CHROME 158 (WINDOWS X64 & WASM)
  # ============================================================================
  build-skia-windows:
    name: Build Skia Chrome 158 (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Skia Repository
        uses: actions/checkout@v4
        with:
          repository: google/skia
          ref: chrome/m150
          fetch-depth: 1
          path: skia

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync Skia Dependencies
        working-directory: skia
        run: |
          git config --global http.version HTTP/1.1
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "Dependency sync attempt $attempt"
            python tools/git-sync-deps
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Dependencies synced successfully"
              break
            }
            if ($attempt -eq 4) {
              Write-Error "Dependency synchronization failed"
              exit 1
            }
            Start-Sleep -Seconds 10
          }

      - name: Fetch GN & Ninja
        working-directory: skia
        shell: bash
        run: |
          python tools/fetch_gn.py || bin/fetch-gn
          pip install ninja

      - name: Generate Build Files (Windows MSVC)
        working-directory: skia
        shell: bash
        run: |
          bin/gn gen out/Windows_x64 --args='
            target_os="win"
            target_cpu="x64"
            is_debug=false
            is_official_build=true
            skia_enable_ganesh=true
            skia_use_gl=true
            skia_use_vulkan=true
            skia_use_freetype=true
            skia_use_harfbuzz=true
            skia_use_icu=true
            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
          '

      - name: Compile Skia
        working-directory: skia
        shell: bash
        run: ninja -C out/Windows_x64

      - name: Package Windows Artifacts
        working-directory: skia
        shell: bash
        run: |
          set -e
          mkdir -p release_assets/lib
          cp -r include release_assets/

          if [ -d modules ]; then
            find modules -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          if [ -d third_party ]; then
            find third_party -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          find out/Windows_x64 -type f \( -name "*.lib" -o -name "*.dll" \) -exec cp {} release_assets/lib/ \;

          if [ -z "$(find release_assets/lib -type f -print -quit)" ]; then
            echo "No compiled libraries found!"
            exit 1
          fi

          powershell -Command "Compress-Archive -Path release_assets\* -DestinationPath skia-windows-x64-prebuilt.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-windows-x64
          path: skia/skia-windows-x64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  build-skia-wasm:
    name: Build Skia Chrome 158 (Wasm / Emscripten)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skia Repository
        uses: actions/checkout@v4
        with:
          repository: google/skia
          ref: chrome/m150
          fetch-depth: 1
          path: skia

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libfontconfig-dev \
            git python3-venv ninja-build zip unzip

      - name: Sync Skia Dependencies
        working-directory: skia
        run: |
          set -e
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do
            echo "Dependency sync attempt $attempt"
            if python tools/git-sync-deps; then
              echo "Dependencies synced successfully"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Dependency synchronization failed"
              exit 1
            fi
            sleep 10
          done

      - name: Fetch GN
        working-directory: skia
        run: |
          bin/fetch-gn
          chmod +x bin/gn
          bin/gn --version

      - name: Generate Build Files (Wasm)
        working-directory: skia
        run: |
          bin/gn gen out/Wasm --args='
            target_os="wasm"
            target_cpu="wasm"
            cc="emcc"
            cxx="em++"
            ar="emar"
            is_debug=false
            is_official_build=true
            skia_enable_ganesh=true
            skia_use_gl=true
            skia_use_webgl=true
            skia_use_vulkan=false
            skia_use_freetype=true
            skia_use_harfbuzz=true
            skia_use_icu=true
            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
          '

      - name: Compile Skia
        working-directory: skia
        run: ninja -C out/Wasm

      - name: Package Wasm Artifacts
        working-directory: skia
        run: |
          set -e
          mkdir -p release_assets/lib
          cp -r include release_assets/

          if [ -d modules ]; then
            find modules -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          if [ -d third_party ]; then
            find third_party -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          find out/Wasm -type f -name "*.a" -exec cp {} release_assets/lib/ \;

          if [ -z "$(find release_assets/lib -type f -print -quit)" ]; then
            echo "No compiled libraries found!"
            exit 1
          fi

          cd release_assets
          zip -r ../skia-wasm-prebuilt.zip .
          cd ..
          unzip -t skia-wasm-prebuilt.zip

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-wasm
          path: skia/skia-wasm-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 5. PUBLISH UNIFIED GITHUB RELEASE
  # ============================================================================
  publish-release:
    name: Publish All Prebuilt Libraries
    runs-on: ubuntu-latest
    needs:
      - build-box2d-windows
      - build-box2d-wasm
      - build-quickjs-windows
      - build-quickjs-wasm
      - build-sdl3-windows
      - build-sdl3-wasm
      - build-skia-windows
      - build-skia-wasm
    if: github.event_name != 'pull_request'

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify Downloaded Files
        run: ls -lh release_assets

      - name: Update Continuous Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Prebuilt Libraries"
          body: |
            Automated continuous build of prebuilt libraries:
            - **Box2D** (Windows x64 & Wasm)
            - **QuickJS-NG** (Windows x64 & Wasm)
            - **SDL3** (Windows x64 & Wasm)
            - **Skia Chrome 158 / m150** (Windows x64 & Wasm)
          artifacts: "release_assets/*"
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
