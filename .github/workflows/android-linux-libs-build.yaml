name: Build All Prebuilt Libraries

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. BOX2D (ANDROID & LINUX)
  # ============================================================================
  build-box2d-android:
    name: Build Box2D Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Box2D Repository
        uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Configure CMake (Android)
        run: |
          cmake -S . -B build_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_android \
            -DBUILD_SHARED_LIBS=OFF \
            -DBOX2D_SAMPLES=OFF \
            -DBOX2D_UNIT_TESTS=OFF \
            -DBOX2D_VALIDATION=OFF

      - name: Build & Install Box2D
        run: |
          cmake --build build_android --config Release
          cmake --install build_android

      - name: Package Artifacts (ZIP)
        run: |
          cd install_dir_android
          zip -r ../box2d-android-arm64-prebuilt.zip include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box2d-android-arm64
          path: box2d-android-arm64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  build-box2d-linux:
    name: Build Box2D Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Box2D Repository
        uses: actions/checkout@v4
        with:
          repository: 'erincatto/box2d'
          ref: 'main'
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libwayland-dev wayland-protocols libxkbcommon-dev xorg-dev

      - name: Configure CMake (Linux)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir \
            -DBUILD_SHARED_LIBS=OFF \
            -DBOX2D_SAMPLES=OFF \
            -DBOX2D_UNIT_TESTS=OFF \
            -DBOX2D_VALIDATION=OFF

      - name: Build & Install Box2D
        run: |
          cmake --build build --config Release
          cmake --install build

      - name: Package Artifacts (TAR.GZ)
        run: tar -czvf box2d-linux-x64-prebuilt.tar.gz -C install_dir include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box2d-linux-x64
          path: box2d-linux-x64-prebuilt.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 2. QUICKJS-NG (ANDROID & LINUX)
  # ============================================================================
  build-quickjs-android:
    name: Build QuickJS Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuickJS-NG Repository
        uses: actions/checkout@v4
        with:
          repository: 'quickjs-ng/quickjs'
          ref: 'master'
          fetch-depth: 1

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Configure CMake (Android)
        run: |
          cmake -S . -B build_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_android \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build & Install QuickJS-NG
        run: |
          cmake --build build_android --config Release
          cmake --install build_android

      - name: Package Artifacts (ZIP)
        run: |
          cd install_dir_android
          zip -r ../quickjs-android-arm64-prebuilt.zip include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-android-arm64
          path: quickjs-android-arm64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  build-quickjs-linux:
    name: Build QuickJS Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuickJS-NG Repository
        uses: actions/checkout@v4
        with:
          repository: 'quickjs-ng/quickjs'
          ref: 'master'
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake (Linux)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build & Install QuickJS-NG
        run: |
          cmake --build build --config Release
          cmake --install build

      - name: Package Artifacts (TAR.GZ)
        run: tar -czvf quickjs-linux-x64-prebuilt.tar.gz -C install_dir include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-linux-x64
          path: quickjs-linux-x64-prebuilt.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 3. SDL3 (ANDROID & LINUX)
  # ============================================================================
  build-sdl3-android:
    name: Build SDL3 Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDL Repository
        uses: actions/checkout@v4
        with:
          repository: 'libsdl-org/SDL'
          ref: 'main'
          fetch-depth: 1

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip

      - name: Configure CMake (Android)
        run: |
          cmake -S . -B build_android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir_android \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON

      - name: Build & Install SDL3
        run: |
          cmake --build build_android --config Release
          cmake --install build_android

      - name: Package Artifacts (ZIP)
        run: |
          cd install_dir_android
          zip -r ../sdl3-android-arm64-prebuilt.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-android-arm64
          path: sdl3-android-arm64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  build-sdl3-linux:
    name: Build SDL3 Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDL Repository
        uses: actions/checkout@v4
        with:
          repository: 'libsdl-org/SDL'
          ref: 'main'
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev \
            libxtst-dev

      - name: Configure CMake (Linux)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install_dir \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON

      - name: Build & Install SDL3
        run: |
          cmake --build build --config Release
          cmake --install build

      - name: Package Artifacts (TAR.GZ)
        run: tar -czvf sdl3-linux-x64-prebuilt.tar.gz -C install_dir include lib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-linux-x64
          path: sdl3-linux-x64-prebuilt.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 4. SKIA CHROME 158 (ANDROID & LINUX)
  # ============================================================================
  build-skia-linux:
    name: Build Skia Chrome 158 (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skia Repository
        uses: actions/checkout@v4
        with:
          repository: google/skia
          ref: chrome/m150
          fetch-depth: 1
          path: skia

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libfontconfig-dev libgl1-mesa-dev \
            libvulkan-dev git python3-venv ninja-build zip unzip

      - name: Verify Skia Version
        working-directory: skia
        run: |
          echo "Skia branch: $(git branch --show-current)"
          echo "Skia commit: $(git rev-parse HEAD)"
          grep SK_MILESTONE include/core/SkMilestone.h

      - name: Sync Skia Dependencies
        working-directory: skia
        run: |
          set -e
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do
            echo "Dependency sync attempt $attempt"
            if python tools/git-sync-deps; then
              echo "Dependencies synced successfully"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Dependency synchronization failed"
              exit 1
            fi
            sleep 10
          done

      - name: Fetch GN
        working-directory: skia
        run: |
          bin/fetch-gn
          chmod +x bin/gn
          bin/gn --version

      - name: Generate Build Files
        working-directory: skia
        run: |
          bin/gn gen out/Linux_x64 --args='
            target_os="linux"
            target_cpu="x64"
            is_debug=false
            is_official_build=true
            skia_enable_ganesh=true
            skia_use_gl=true
            skia_use_vulkan=true
            skia_use_freetype=true
            skia_use_harfbuzz=true
            skia_use_icu=true
            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
          '

      - name: Compile Skia
        working-directory: skia
        run: ninja -C out/Linux_x64

      - name: Package Linux Artifacts
        working-directory: skia
        run: |
          set -e
          mkdir -p release_assets/lib
          cp -r include release_assets/

          if [ -d modules ]; then
            find modules -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          if [ -d third_party ]; then
            find third_party -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          find out/Linux_x64 -type f \( -name "*.a" -o -name "*.so" \) -exec cp {} release_assets/lib/ \;

          if [ -z "$(find release_assets/lib -type f -print -quit)" ]; then
            echo "No compiled libraries found!"
            exit 1
          fi

          tar -czvf skia-linux-x64-prebuilt.tar.gz -C release_assets .
          tar -tzf skia-linux-x64-prebuilt.tar.gz

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-linux-x64
          path: skia/skia-linux-x64-prebuilt.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-skia-android:
    name: Build Skia Chrome 158 (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skia Repository
        uses: actions/checkout@v4
        with:
          repository: google/skia
          ref: chrome/m150
          fetch-depth: 1
          path: skia

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld libfontconfig-dev \
            git python3-venv ninja-build zip unzip

      - name: Check Android NDK
        run: |
          echo "Android NDK: $ANDROID_NDK_LATEST_HOME"
          if [ -z "$ANDROID_NDK_LATEST_HOME" ] || [ ! -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "Android NDK not found!"
            exit 1
          fi

      - name: Verify Skia Version
        working-directory: skia
        run: |
          echo "Skia branch: $(git branch --show-current)"
          echo "Skia commit: $(git rev-parse HEAD)"
          grep SK_MILESTONE include/core/SkMilestone.h

      - name: Sync Skia Dependencies
        working-directory: skia
        run: |
          set -e
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3 4; do
            echo "Dependency sync attempt $attempt"
            if python tools/git-sync-deps; then
              echo "Dependencies synced successfully"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Dependency synchronization failed"
              exit 1
            fi
            sleep 10
          done

      - name: Fetch GN
        working-directory: skia
        run: |
          bin/fetch-gn
          chmod +x bin/gn
          bin/gn --version

      - name: Generate Build Files
        working-directory: skia
        run: |
          bin/gn gen out/Android_arm64 --args='
            ndk="'$ANDROID_NDK_LATEST_HOME'"
            target_os="android"
            target_cpu="arm64"
            is_debug=false
            is_official_build=true
            skia_enable_ganesh=true
            skia_use_gl=true
            skia_use_vulkan=true
            skia_use_freetype=true
            skia_use_harfbuzz=true
            skia_use_icu=true
            skia_use_system_expat=false
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_harfbuzz=false
            skia_use_system_icu=false
          '

      - name: Compile Skia
        working-directory: skia
        run: ninja -C out/Android_arm64

      - name: Package Android Artifacts
        working-directory: skia
        run: |
          set -e
          mkdir -p release_assets/lib
          cp -r include release_assets/

          if [ -d modules ]; then
            find modules -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          if [ -d third_party ]; then
            find third_party -type f \( -name "*.h" -o -name "*.hpp" -o -name "*.hh" -o -name "*.hxx" \) \
              -exec cp --parents {} release_assets/ \;
          fi

          find out/Android_arm64 -type f \( -name "*.a" -o -name "*.so" \) -exec cp {} release_assets/lib/ \;

          if [ -z "$(find release_assets/lib -type f -print -quit)" ]; then
            echo "No compiled libraries found!"
            exit 1
          fi

          cd release_assets
          zip -r ../skia-android-arm64-prebuilt.zip .
          cd ..
          unzip -t skia-android-arm64-prebuilt.zip

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skia-android-arm64
          path: skia/skia-android-arm64-prebuilt.zip
          if-no-files-found: error
          retention-days: 7

  # ============================================================================
  # 5. PUBLISH UNIFIED GITHUB RELEASE
  # ============================================================================
  publish-release:
    name: Publish All Prebuilt Libraries
    runs-on: ubuntu-latest
    needs:
      - build-box2d-android
      - build-box2d-linux
      - build-quickjs-android
      - build-quickjs-linux
      - build-sdl3-android
      - build-sdl3-linux
      - build-skia-linux
      - build-skia-android
    if: github.event_name != 'pull_request'

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Verify Downloaded Files
        run: ls -lh release_assets

      - name: Update Continuous Release
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "Latest Prebuilt Libraries"
          body: |
            Automated continuous build of prebuilt libraries:
            - **Box2D** (Linux x64 & Android ARM64)
            - **QuickJS-NG** (Linux x64 & Android ARM64)
            - **SDL3** (Linux x64 & Android ARM64)
            - **Skia Chrome 158 / m150** (Linux x64 & Android ARM64)
          artifacts: "release_assets/*"
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
